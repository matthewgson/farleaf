# Push a tag like v0.4.0 to build farleaf (with MuPDF compiled in) for each
# platform and publish a GitHub release that install.sh downloads from. The
# release also carries MuPDF's exact source, as the AGPL asks of binaries.
# Run it by hand (workflow_dispatch) to build without releasing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: mac-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { platform: mac-x64, os: macos-latest, target: x86_64-apple-darwin }
          # Linux: zig links against glibc 2.28 (2018), so the binary runs on
          # older systems than the runner's.
          - { platform: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, glibc: ".2.28" }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, glibc: ".2.28" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: scripts/fetch-mupdf.sh
      - name: Build
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            python3 -m venv "$RUNNER_TEMP/zig"
            "$RUNNER_TEMP/zig/bin/pip" install -q cargo-zigbuild==0.24.0 ziglang==0.17.0
            export PATH="$RUNNER_TEMP/zig/bin:$PATH"
            cargo zigbuild --release --locked --target ${{ matrix.target }}${{ matrix.glibc }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          d=dist/farleaf-${{ matrix.platform }}
          mu=vendor/mupdf-1.28.5-source
          mkdir -p "$d/licenses/mupdf"
          cp target/${{ matrix.target }}/release/farleaf LICENSE README.md "$d/"
          cp "$mu/COPYING" "$d/licenses/mupdf/"
          # The libraries inside MuPDF that this build includes.
          for lib in brotli cmark-gfm extract freetype gumbo-parser harfbuzz jbig2dec lcms2 libjpeg mujs openjpeg zlib; do
            mkdir -p "$d/licenses/$lib"
            for f in "$mu/thirdparty/$lib"/LICENSE* "$mu/thirdparty/$lib"/COPYING* "$mu/thirdparty/$lib"/README; do
              if [ -f "$f" ]; then cp "$f" "$d/licenses/$lib/"; fi
            done
          done
          tar -czf "$d.tar.gz" -C dist "farleaf-${{ matrix.platform }}"
      - name: Smoke test
        run: |
          if [ ${{ matrix.platform }} = mac-x64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "no Rosetta on this runner; skipped"; exit 0
          fi
          d=dist/farleaf-${{ matrix.platform }}
          "$d/farleaf" --version
          FARLEAF_BENCH_PAGES=2 "$d/farleaf" --bench docs/demo/demo.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: farleaf-${{ matrix.platform }}
          path: dist/farleaf-${{ matrix.platform }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: MuPDF's source
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' scripts/fetch-mupdf.sh)
          sum=$(sed -n 's/^SHA256="\(.*\)"$/\1/p' scripts/fetch-mupdf.sh)
          curl -fsSL -o "dist/mupdf-$v-source.tar.gz" "https://casper.mupdf.com/downloads/archive/mupdf-$v-source.tar.gz"
          echo "$sum  dist/mupdf-$v-source.tar.gz" | sha256sum -c
      - run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "farleaf $GITHUB_REF_NAME" --generate-notes
