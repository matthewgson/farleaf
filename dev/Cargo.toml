[package]
name = "farleaf-dev"
version = "0.0.0"
edition = "2021"
description = "farleaf's development tools: a fake terminal, the stress test, sample PDFs and the demo GIF"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Text in screenshots and the demo GIF.
fontdue = "0.9"
gif = "0.14"
