[package]
name = "farleaf"
version = "0.1.0"
edition = "2021"
description = "Fast, minimal terminal PDF reader for Kitty-graphics terminals (Ghostty), herdr and SSH"
license = "MIT"
repository = "https://github.com/matthewgson/farleaf"
publish = false

[dependencies]
libc = "0.2"
# pdfium is loaded at runtime, so building needs no C toolchain.
libloading = "0.8"
# zlib-rs: pure Rust and fast. Its level 1 writes fixed-Huffman blocks that
# crash Ghostty 1.3.1 on re-placement, so src/encode.rs never uses level 1.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
